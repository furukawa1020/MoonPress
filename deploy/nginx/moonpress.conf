# Include inside an NGINX http {} block with mime.types loaded. TLS/CDN termination is configured by
# the operator. Publish only a verified public bundle to this root.
server {
    listen 8080;
    server_name _;
    root /srv/moonpress/public;
    index index.html;
    autoindex off;
    server_tokens off;
    disable_symlinks on;
    sendfile on;
    client_max_body_size 1k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 10s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    large_client_header_buffers 2 8k;
    reset_timedout_connection on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    # Filenames are mutable between builds: revalidate instead of immutable.
    add_header Cache-Control no-cache always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    # Public marker emitted by the compiler and checked after deployment.
    location = /.nojekyll { try_files $uri =404; }
    location ~ /\. { return 404; }
    location ~* \.(php[0-9]?|phtml|phar|cgi|pl|py|rb|sh|mbt|md|sql|ini|log|bak|conf)(/|$) { return 404; }
    location / { try_files $uri $uri/ =404; }
}
