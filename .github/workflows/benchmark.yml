name: Benchmark
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/benchmark.sh
      - .github/workflows/benchmark.yml
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch --depth=1 origin "$REVISION"
          git checkout --detach FETCH_HEAD
      - name: Set up MoonBit
        run: |
          bash scripts/setup.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify and compile
        run: bash scripts/check.sh
      - name: Measure native CLI
        run: |
          bash scripts/benchmark.sh bench-results
          cat bench-results/report.md >> "$GITHUB_STEP_SUMMARY"
          cat bench-results/raw.csv
