name: Native CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Fetch exact revision without Node actions
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch --depth=1 origin "$REVISION"
          git checkout --detach FETCH_HEAD
      - name: Set up verified MoonBit toolchain
        run: |
          bash scripts/setup.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check, test, compile and exercise CLI
        run: bash scripts/check.sh
      - name: Exercise local admin in real Chrome without JavaScript
        run: |
          google-chrome --version
          chromedriver --version
          python3 scripts/browser-test.py
      - name: Show browser diagnostics on failure
        if: failure()
        run: |
          for report in _build/browser-verification/report.json _build/browser-verification/admin.log _build/browser-verification/driver.log _build/browser-verification/failure.html; do
            if test -f "$report"; then tail -c 20000 "$report"; fi
          done
