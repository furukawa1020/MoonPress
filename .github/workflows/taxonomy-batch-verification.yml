name: Taxonomy batch exact source verification
on:
  push:
    branches: [verify/721-taxonomy-batch]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: native (PR ${{ matrix.source.pr }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        source: [{"pr":741,"revision":"822f9d9e9d35f10930598719034bf54eb59c1b19","tree":"576c884735f7852c31d5af3d2b036749e2e48ba6"}]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Fetch and verify exact source
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ matrix.source.revision }}
          EXPECTED_TREE: ${{ matrix.source.tree }}
        run: |
          git init .
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch --depth=1 origin "$REVISION"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$REVISION"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git log -1 --format='%H %T'
      - name: Set up pinned MoonBit native toolchain
        run: |
          bash scripts/setup.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify native library and all CLI regressions
        run: bash scripts/check.sh
      - name: Verify administration in real Chrome without JavaScript
        run: |
          google-chrome --version
          chromedriver --version
          python3 scripts/browser-test.py
          python3 scripts/browser-comment-test.py
  compare:
    name: compare (PR ${{ matrix.source.pr }})
    strategy:
      fail-fast: false
      matrix:
        source: [{"pr":741,"revision":"822f9d9e9d35f10930598719034bf54eb59c1b19","tree":"576c884735f7852c31d5af3d2b036749e2e48ba6"}]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch and verify exact source
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ matrix.source.revision }}
          EXPECTED_TREE: ${{ matrix.source.tree }}
        run: |
          git init .
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch --depth=1 origin "$REVISION"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$REVISION"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git log -1 --format='%H %T'
      - name: Set up pinned MoonBit native toolchain
        run: |
          bash scripts/setup.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Build exact native source
        run: moon build --target native --release
      - name: Install production serving comparison dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx php8.3-fpm
          sudo systemctl stop nginx php8.3-fpm
      - name: Verify hardened public origin
        run: python3 scripts/nginx-origin-test.py
      - name: Compare actual WordPress with exact native source
        run: bash benchmarks/wordpress/run.sh
